cs612_2_controller_manager:
  ros__parameters:
    update_rate: 500

    cs612_2_joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    cs612_2_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

cs612_2_joint_state_broadcaster:
  ros__parameters:
    publish_rate: 50.0
    use_local_topics: true

cs612_2_joint_trajectory_controller:
  ros__parameters:
    joints:
      - cs612_2_shoulder_pan_joint
      - cs612_2_shoulder_lift_joint
      - cs612_2_elbow_joint
      - cs612_2_wrist_1_joint
      - cs612_2_wrist_2_joint
      - cs612_2_wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.3
      goal_time: 0.0
      cs612_2_shoulder_pan_joint: { trajectory: 3.5, goal: 0.3 }
      cs612_2_shoulder_lift_joint: { trajectory: 1.5, goal: 0.2 }
      cs612_2_elbow_joint: { trajectory: 1.5, goal: 0.2 }
      cs612_2_wrist_1_joint: { trajectory: 1.5, goal: 0.2 }
      cs612_2_wrist_2_joint: { trajectory: 1.5, goal: 0.2 }
      cs612_2_wrist_3_joint: { trajectory: 1.5, goal: 0.2 }
