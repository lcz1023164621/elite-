# 与 worlds/my_world.sdf 中模型一致；机械臂 base 在原点且未移动时，可用 base_link 作为参考系。
# 若修改 world 里 rect_pickup / carton_box / 机器人 base pose，请同步改此处。
# 当前点位按“前右侧中等半径抓取 + 前左侧较远放箱”布置，优先避免反肘/绕腕抓取。
reference_frame: base_link

rect_pickup:
  # 与 worlds/my_world.sdf 保持一致（model rect_pickup pose）
  center_xyz: [0.56, 0.0, 0.04]
  size_xyz: [0.20, 0.14, 0.08]
  # 顶面几何中心（世界/base_link）
  # top_center = center + [0, 0, +size_z/2]
  approach_clearance: 0.06

carton_box:
  # 与 worlds/my_world.sdf 保持一致（model carton_box pose）
  model_pose_xyz: [0.88, -0.34, 0.0]
  # 底板顶面近似高度（link 原点在地面上，底板 z=0.003, 半高 0.003 → 顶面 z≈0.006）
  floor_top_z: 0.006
  # 内腔中心 XY 与模型原点一致（箱体关于原点对称）
  center_xy: [0.88, -0.34]
  # 放置时 TCP 目标：内腔上方（避免撞壁，需根据吸盘长度微调）
  place_height_above_floor: 0.12
