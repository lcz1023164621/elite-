# 与 worlds/my_world.sdf 中模型一致；机械臂 base 在原点且未移动时，可用 base_link 作为参考系。
# 若修改 world 里 rect_pickup / carton_box / 机器人 base pose，请同步改此处。
# 当前点位：
#   rect_pickup + carton_box 初始位于 1 号标记位置 (-0.82, 0.30)，关于机械臂 Y 轴对称；
#   放置目标位于 (0.82, -0.30, 0)，与 rect_pickup 初始位置 (-0.82, 0.30) 关于原点对称。
reference_frame: base_link

rect_pickup:
  # 与 worlds/my_world.sdf 保持一致（model rect_pickup pose）
  center_xyz: [-0.82, 0.30, 0.046]
  size_xyz: [0.20, 0.14, 0.08]
  # 顶面几何中心（世界/base_link）
  # top_center = center + [0, 0, +size_z/2]
  approach_clearance: 0.06

carton_box:
  # 与 worlds/my_world.sdf 保持一致（model carton_box pose）
  model_pose_xyz: [-0.82, 0.30, 0.0]
  outer_size_xyz: [0.42, 0.30, 0.22]
  wall_thickness: 0.008
  floor_thickness: 0.006
  # 底板顶面近似高度（link 原点在地面上，底板 z=0.003, 半高 0.003 → 顶面 z≈0.006）
  floor_top_z: 0.006
  # 内腔中心 XY 与模型原点一致（箱体关于原点对称）
  center_xy: [-0.82, 0.30]
  # 放置时 TCP 目标：内腔上方（避免撞壁，需根据吸盘长度微调）
  place_height_above_floor: 0.18

box2:
  # box2 位于 cs612_2 右前方（传送带在 cs612_2 左侧）。
  # cs612_2 world pose=(2.300,-0.600,0.001)，box2 中心约 dx=+0.60, dy=+0.60。
  model_pose_xyz: [2.90000, 0.00000, 0.0]
  outer_size_xyz: [0.42, 0.30, 0.22]
  wall_thickness: 0.008
  floor_thickness: 0.006
  floor_top_z: 0.006
  center_xy: [2.90000, 0.00000]
  place_height_above_floor: 0.18

middle_conveyor:
  # 与 worlds/my_world.sdf 中 middle_conveyor 保持一致
  model_pose_xyz: [1.00825, -0.35547, 0.0]
  model_pose_rpy: [0.0, 0.0, -0.338955]
  size_xyz: [1.50, 0.30, 0.20]
  # IFRA 替换后主驱动为 track 线速度，此参数仅用于兼容旧配置。
  roller_radius_m: 0.03
  # 传送带顶面高度（belt collision 中心 0.200 + 半高 0.005）。
  top_surface_z: 0.205
  # 传送带起始边缘（靠近 arm1）坐标。程序会按物体半长+margin 向传送带内部偏移，
  # 使 rect_pickup 前缘对齐起点、物体中心落在皮带上。
  start_xyz: [0.300923, -0.106094, 0.205]
  place_inset_margin_m: 0.28

place_target:
  # 这里保留传送带起始边缘；auto_pick_place 会换算为物体中心放置点。
  tcp_xyz: [0.300923, -0.106094, 0.205]
